<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #ffffff;
            --surface-hover: #f1f3f4;
            --border: #dadce0;
            --text-main: #202124;
            --text-sub: #5f6368;
            --accent: #1a73e8;
            --switch-off: #bdc1c6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #292a2d;
                --surface-hover: #35363a;
                --border: #3c4043;
                --text-main: #e8eaed;
                --text-sub: #9aa0a6;
                --accent: #8ab4f8;
                --switch-off: #5f6368;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 256px;
            padding: 12px 14px;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        .header {
            font-size: 13px;
            font-weight: 600;
            padding-bottom: 10px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-dot {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            gap: 12px;
        }

        .label-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .label-title {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-main);
        }

        .label-sub {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* Native Chromium Pill Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 18px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: var(--switch-off);
            border-radius: 999px;
            transition: 0.2s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: var(--bg);
            border-radius: 50%;
            transition: 0.2s;
        }

        input:focus-visible+.slider {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        input:checked+.slider {
            background-color: var(--accent);
        }

        input:checked+.slider:before {
            transform: translateX(14px);
        }

        .reset-btn {
            margin-top: 8px;
            width: 100%;
            padding: 6px 10px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .reset-btn:hover {
            background: var(--surface-hover);
        }

        .reset-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .note {
            margin: 10px 0 0;
            font-size: 10.5px;
            line-height: 1.4;
            color: var(--text-sub);
        }
    </style>
</head>

<body>
    <div class="header">
        <span>TabNet Speed Monitor</span>
        <span class="status-dot" id="version"></span>
    </div>

    <div class="control-row">
        <div class="label-group">
            <span class="label-title">Show speed overlay</span>
            <span class="label-sub">Display real-time speed on tabs</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="toggle-enabled" aria-label="Show speed overlay" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="control-row">
        <div class="label-group">
            <span class="label-title">Unlock widget position</span>
            <span class="label-sub">Drag overlay to move anywhere</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="toggle-move" aria-label="Unlock widget position">
            <span class="slider"></span>
        </label>
    </div>

    <button class="reset-btn" id="reset-pos">Reset to default corner</button>

    <p class="note">Speeds are estimates based on HTTP headers, so they may differ from your real network usage.</p>

    <script src="popup.js"></script>
</body>

</html>
